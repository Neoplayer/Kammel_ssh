name: Build APK

# Neoplayer fork: every push to the fork's main branch builds an arm64 release
# APK signed with the fork's own key and uploads it as a workflow artifact.
on:
  push:
    branches: [neoplayer]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: test & build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

      - name: i18n coverage
        run: python3 scripts/i18n_check.py

      # build.gradle.kts silently falls back to the debug key when
      # key.properties is missing, so a missing secret must fail the build
      # instead of producing an APK that won't install over ABSssh N.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: flutter build apk (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Check signature and name the APK
        id: apk
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          src=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$apksigner" verify --print-certs "$src" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signing cert SHA-256: $cert"
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected certificate"; exit 1
          fi
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          name="ABSssh-N-v${version}-${GITHUB_SHA::7}-arm64"
          mkdir -p out && cp "$src" "out/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/*.apk
          compression-level: 0
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
